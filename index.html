      :root {
        --bg: #f1f1ee;
        --pn: #fff;
        --ink: #16171a;
        --mu: #5d6068;
        --ln: #d9d9d4;
        --sc: #e10600;
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #141518;
          --pn: #1e2024;
          --ink: #ecece8;
          --mu: #9a9da5;
          --ln: #30333a;
        }
      }
      :root[data-theme="dark"] {
        --bg: #141518;
        --pn: #1e2024;
        --ink: #ecece8;
        --mu: #9a9da5;
        --ln: #30333a;
      }
      html {
        scroll-padding-top: env(safe-area-inset-top, 0px);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font:
          16px/1.5 Barlow,
          system-ui,
          sans-serif;
      }
      .kerb {
        height: 12px;
        background: repeating-linear-gradient(
          90deg,
          var(--sc) 0 28px,
          #fff 28px 56px
        );
      }
      main {
        max-width: 720px;
        margin: 0 auto;
        padding: 20px 16px 56px;
      }
      h1,
      h2,
      h3 {
        font-family: Formula1, "Barlow Condensed", Impact, sans-serif;
        margin: 0;
        line-height: 1.1;
      }
      h1 {
        font-size: clamp(32px, 8.5vw, 58px);
        font-weight: 700;
      }
      h2 {
        font-size: 23px;
        font-weight: 700;
      }
      h3 {
        font-size: 16px;
        font-weight: 700;
        margin: 20px 0 8px;
      }
      .lead {
        font-size: 18px;
        color: var(--mu);
        max-width: 56ch;
      }
      .pn {
        background: var(--pn);
        border: 1px solid var(--ln);
        border-left: 6px solid var(--sc);
        padding: 16px;
        margin: 16px 0;
      }
      .top {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        flex-wrap: wrap;
        align-items: baseline;
      }
      .top b {
        font:
          700 20px Formula1,
          sans-serif;
      }
      .mu {
        color: var(--mu);
      }
      .m {
        display: grid;
        grid-template-columns: 96px 1fr 28px;
        align-items: center;
        gap: 8px;
        margin: 6px 0;
        font-size: 14px;
      }
      .m i {
        height: 8px;
        background: var(--ln);
        position: relative;
      }
      .m i:after {
        content: "";
        position: absolute;
        inset: 0;
        width: var(--v);
        background: var(--sc);
      }
      .m b {
        text-align: right;
      }
      button {
        font: inherit;
        cursor: pointer;
        color: var(--ink);
      }
      .cb {
        display: block;
        width: 100%;
        text-align: left;
        background: var(--pn);
        border: 1px solid var(--ln);
        padding: 14px;
        margin: 8px 0;
        font-weight: 500;
      }
      .cb:hover,
      .cb:focus-visible {
        border-color: var(--sc);
        outline: 2px solid var(--sc);
        outline-offset: 1px;
      }
      .go {
        background: var(--sc);
        color: #fff;
        border: 0;
        padding: 13px 22px;
        font:
          700 15px Formula1,
          sans-serif;
        letter-spacing: 0.02em;
        margin-top: 12px;
      }
      .go:focus-visible {
        outline: 2px solid var(--ink);
        outline-offset: 2px;
      }
      .ch {
        display: inline-block;
        font-size: 13px;
        font-weight: 600;
        padding: 2px 8px;
        margin: 8px 6px 0 0;
        border: 1px solid var(--ln);
      }
      .up {
        color: #128a4a;
        border-color: #128a4a;
      }
      .dn {
        color: #d3302f;
        border-color: #d3302f;
      }
      .strip {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        margin: 8px 0;
      }
      .p {
        min-width: 34px;
        text-align: center;
        padding: 3px 4px;
        border: 1px solid var(--ln);
        font:
          700 12px Formula1,
          sans-serif;
        background: var(--pn);
      }
      .p.pd {
        background: var(--sc);
        color: #fff;
        border-color: var(--sc);
      }
      .p.x {
        color: #d3302f;
        border-color: #d3302f;
      }
      .big {
        font:
          700 clamp(40px, 12vw, 76px)/1.05 Formula1,
          sans-serif;
      }
      .st {
        display: flex;
        gap: 20px;
        flex-wrap: wrap;
        margin: 8px 0;
      }
      .st div b {
        display: block;
        font:
          700 21px Formula1,
          sans-serif;
      }
      .tw {
        overflow-x: auto;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 15px;
      }
      td,
      th {
        padding: 5px 8px;
        border-bottom: 1px solid var(--ln);
        text-align: left;
      }
      th {
        color: var(--mu);
        font-weight: 500;
      }
      tr.me {
        background: color-mix(in srgb, var(--sc) 18%, transparent);
        font-weight: 600;
      }
      input {
        font: inherit;
        width: 100%;
        padding: 11px;
        border: 1px solid var(--ln);
        background: var(--pn);
        color: var(--ink);
        margin: 6px 0 4px;
      }
      .grid {
        display: grid;
        gap: 10px;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        margin-top: 10px;
      }
      .grid .cb b {
        font:
          700 16px Formula1,
          sans-serif;
        display: block;
      }
      @media (prefers-reduced-motion: no-preference) {
        .pn {
          animation: in 0.25s ease-out;
        }
        @keyframes in {
          from {
            opacity: 0;
            transform: translateY(6px);
          }
        }
      }
      .lad {
        display: flex;
        gap: 6px;
        margin: 4px 0 8px;
        align-items: center;
      }
      .lk {
        margin-left: auto;
        background: none;
        border: 1px solid var(--ln);
        padding: 3px 12px;
        font:
          600 14px Barlow,
          sans-serif;
      }
      .cb.on {
        border-color: var(--sc);
        outline: 2px solid var(--sc);
      }
      .pg {
        height: 6px;
        background: var(--ln);
        margin: 6px 0 10px;
      }
      .pg i {
        display: block;
        height: 100%;
        background: var(--sc);
      }
      .tro.lock {
        opacity: 0.45;
        filter: grayscale(1);
      }
      .lad span {
        padding: 3px 14px;
        border: 1px solid var(--ln);
        font:
          700 13px Formula1,
          sans-serif;
        color: var(--mu);
      }
      .lad span.on {
        background: var(--c);
        border-color: var(--c);
        color: #fff;
      }
      .tb {
        display: inline-grid;
        place-items: center;
        flex: none;
        width: 40px;
        height: 40px;
        background: var(--tc);
        color: var(--tx, #fff);
        font:
          700 13px Formula1,
          sans-serif;
        clip-path: polygon(0 0, 100% 0, 100% 62%, 50% 100%, 0 62%);
        height: 46px;
        width: 40px;
        padding-bottom: 7px;
      }
      .tb.sm {
        width: 24px;
        height: 28px;
        font-size: 11px;
        padding-bottom: 4px;
      }
      .tn {
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .lk.on {
        background: var(--c);
        border-color: var(--c);
        color: #fff;
      }
      .tm {
        display: flex;
        gap: 12px;
        align-items: center;
        margin: 10px 0;
      }
      .tm img {
        margin-bottom: 4px !important;
      }
      .of {
        display: flex;
        gap: 12px;
        align-items: center;
      }
      .tg {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 6px;
      }
      .tg i,
      .tg em {
        font:
          600 12px Barlow,
          sans-serif;
        font-style: normal;
        padding: 1px 7px;
        border: 1px solid;
      }
      .tg .u {
        color: #128a4a;
      }
      .tg .d {
        color: #d3302f;
      }
      .tg em {
        color: var(--mu);
      }
      .dots {
        display: flex;
        align-items: center;
        gap: 6px;
        margin: 6px 0 12px;
        color: var(--mu);
        font-size: 14px;
      }
      .dots i {
        width: 22px;
        height: 6px;
        background: var(--ln);
      }
      .dots i.d {
        background: var(--sc);
      }
      .dots i.c {
        background: var(--ink);
      }
      .tl {
        display: inline-grid;
        place-items: center;
        flex: none;
        width: 52px;
        height: 34px;
        padding: 3px;
      }
      .tl img {
        max-width: 100%;
        max-height: 100%;
        object-fit: contain;
      }
      .tl.sm {
        width: 38px;
        height: 24px;
        padding: 2px;
      }
      .tl.lt img {
        filter: brightness(0.3);
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) .tl.dk img {
          filter: brightness(0) invert(0.93);
        }
        :root:not([data-theme="light"]) .tl.lt img {
          filter: none;
        }
      }
      :root[data-theme="dark"] .tl.dk img {
        filter: brightness(0) invert(0.93);
      }
      :root[data-theme="dark"] .tl.lt img {
        filter: none;
      }
      .p {
        display: inline-flex;
        flex-direction: column;
        align-items: center;
        gap: 1px;
        min-width: 46px;
      }
      .p small {
        font:
          600 10px Barlow,
          sans-serif;
        letter-spacing: 0.05em;
      }
      .fg {
        vertical-align: middle;
        border: 1px solid rgba(128, 128, 128, 0.4);
      }
      .paper {
        background: #f1ead7;
        color: #1d1b16;
        font-family: Georgia, "Times New Roman", serif;
        padding: 22px 20px;
        margin: 14px 0;
        border-radius: 2px;
        box-shadow: 0 8px 22px rgba(0, 0, 0, 0.4);
        position: relative;
        background-image: repeating-linear-gradient(
          transparent 0 27px,
          rgba(0, 0, 0, 0.05) 27px 28px
        );
      }
      .paper .ph {
        display: flex;
        gap: 12px;
        align-items: center;
        border-bottom: 2px solid #1d1b16;
        padding-bottom: 10px;
        margin-bottom: 12px;
      }
      .paper .ph b {
        display: block;
        font:
          700 15px Formula1,
          sans-serif;
        letter-spacing: 0.04em;
      }
      .paper .ph small {
        color: #5b564a;
        font-size: 13px;
      }
      .paper p {
        margin: 8px 0;
      }
      .paper ol {
        padding-left: 22px;
        line-height: 1.75;
        margin: 8px 0;
      }
      .paper li b {
        font-variant: small-caps;
      }
      .paper .sig {
        display: flex;
        gap: 22px;
        margin-top: 26px;
      }
      .paper .sig div {
        flex: 1;
        border-top: 1px solid #1d1b16;
        padding-top: 4px;
        font-size: 12px;
        color: #5b564a;
      }
      .paper .sig i {
        display: block;

          "Snell Roundhand",

      .paper.sgd {

      .paper .stamp {

      details {

      .f4g {

      .f4c {

        padding: 8px;
        margin: 0;

      .f4l {
        display: block;
        background: #fff;
        border-radius: 6px;
        padding: 4px;
        height: 64px;
        margin-bottom: 6px;
      }
      .f4l img {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }
      .f4b {
        display: block;
        height: 5px;
        background: var(--ln);
        margin-top: 4px;

      .f4b:after {

      }
      .wk {

      .gm {

      .bk {

      .bk i {

        top: 0;
        bottom: 0;
        background: #128a4a99;
      }
      .bk b {
        position: absolute;
        top: -6px;
        bottom: -6px;
        width: 6px;
        background: var(--ink);
        left: 0;
      }
      .lad {
        flex-wrap: wrap;
      }
      .ev {
        font-size: 22px;

      .trk {

      .paper li {

      /* ===== REDISEÑO: base oscura estilo Copero + cortes y barra estilo F1.com ===== */
      :root {
        --bg: #f4f4f6;
        --pn: #fff;
        --ink: #15151e;
        --mu: #667085;
        --ln: #e2e2e8;
        --pn2: #f0f0f4;
        --r: 14px;
        --cut: 14px;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #15151e;
          --pn: #1c1c28;
          --pn2: #262634;
          --ink: #f5f5f7;
          --mu: #a3a3b5;
          --ln: #303042;
        }
      }
      :root[data-theme="dark"] {
        --bg: #15151e;
        --pn: #1c1c28;
        --pn2: #262634;
        --ink: #f5f5f7;
        --mu: #a3a3b5;
        --ln: #303042;
      }
      body {
        font:
          16px/1.55 Inter,
          "Akt Variable",
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
        background: var(--bg);
        background-image: radial-gradient(
          900px 380px at 85% -80px,
          color-mix(in srgb, var(--sc) 20%, transparent),
          transparent
        );
      }
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        opacity: 0.035;
        background: repeating-linear-gradient(
          135deg,
          currentColor 0 1px,
          transparent 1px 14px
        );
        z-index: -1;
      }
      .kerb {
        display: none;
      }
      .bar {
        position: sticky;
        top: 0;
        z-index: 20;
        background: #0a0a0c;
        color: #fff;
        border-bottom: 3px solid var(--sc);
      }
      .bar div {
        max-width: 960px;
        margin: 0 auto;
        padding: 0 16px;
        height: 54px;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .bar .lg {
        display: flex;
        align-items: center;
        gap: 10px;
        background: none;
        border: 0;
        color: #fff;
        font:
          italic 800 18px Formula1,

          sans-serif;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        padding: 0;
      }
      .bar .lg i {
        display: inline-block;
        width: 34px;
        height: 20px;
        background: var(--sc);
        transform: skewX(-24deg);
        position: relative;
      }
      .bar .lg i:before,
      .bar .lg i:after {
        content: "";
        position: absolute;
        top: 0;
        bottom: 0;
        width: 5px;
        background: #0a0a0c;
        left: 12px;
      }
      .bar .lg i:after {
        left: 21px;
        width: 3px;
      }
      .bar nav {
        margin-left: auto;
        display: flex;
        gap: 4px;
      }
      .bar button.nv {
        background: none;
        border: 0;
        color: #d4d4d8;
        font:
          700 12px Formula1,
          sans-serif;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        padding: 9px 12px;
        border-radius: 8px;
      }
      .bar button.nv:hover,
