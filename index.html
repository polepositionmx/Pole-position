      :root {
        --bg: #f1f1ee;
        --pn: #fff;
        --ink: #16171a;
        --mu: #5d6068;
        --ln: #d9d9d4;
        --sc: #e10600;
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #141518;
          --pn: #1e2024;
          --ink: #ecece8;
          --mu: #9a9da5;
          --ln: #30333a;
        }
      }
      :root[data-theme="dark"] {
        --bg: #141518;
        --pn: #1e2024;
        --ink: #ecece8;
        --mu: #9a9da5;
        --ln: #30333a;
      }
      html {
        scroll-padding-top: env(safe-area-inset-top, 0px);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font:
          16px/1.5 Barlow,
          system-ui,
          sans-serif;
      }
      .kerb {
        height: 12px;
        background: repeating-linear-gradient(
          90deg,
          var(--sc) 0 28px,
          #fff 28px 56px
        );
      }
      main {
        max-width: 720px;
        margin: 0 auto;
        padding: 20px 16px 56px;
      }
      h1,
      h2,
      h3 {
        font-family: Formula1, "Barlow Condensed", Impact, sans-serif;
        margin: 0;
        line-height: 1.1;
      }
      h1 {
        font-size: clamp(32px, 8.5vw, 58px);
        font-weight: 700;
      }
      h2 {
        font-size: 23px;
        font-weight: 700;
      }
      h3 {
        font-size: 16px;
        font-weight: 700;
        margin: 20px 0 8px;
      }
      .lead {
        font-size: 18px;
        color: var(--mu);
        max-width: 56ch;
      }
      .pn {
        background: var(--pn);
        border: 1px solid var(--ln);
        border-left: 6px solid var(--sc);
        padding: 16px;
        margin: 16px 0;
      }
      .top {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        flex-wrap: wrap;
        align-items: baseline;
      }
      .top b {
        font:
          700 20px Formula1,
          sans-serif;
      }
      .mu {
        color: var(--mu);
      }
      .m {
        display: grid;
        grid-template-columns: 96px 1fr 28px;
        align-items: center;
        gap: 8px;
        margin: 6px 0;
        font-size: 14px;
      }
      .m i {
        height: 8px;
        background: var(--ln);
        position: relative;
      }
      .m i:after {
        content: "";
        position: absolute;
        inset: 0;
        width: var(--v);
        background: var(--sc);
      }
      .m b {
        text-align: right;
      }
      button {
        font: inherit;
        cursor: pointer;
        color: var(--ink);
      }
      .cb {
        display: block;
        width: 100%;
        text-align: left;
        background: var(--pn);
        border: 1px solid var(--ln);
        padding: 14px;
        margin: 8px 0;
        font-weight: 500;
      }
      .cb:hover,
      .cb:focus-visible {
        border-color: var(--sc);
        outline: 2px solid var(--sc);
        outline-offset: 1px;
      }
      .go {
        background: var(--sc);
        color: #fff;
        border: 0;
        padding: 13px 22px;
        font:
          700 15px Formula1,
          sans-serif;
        letter-spacing: 0.02em;
        margin-top: 12px;
      }
      .go:focus-visible {
        outline: 2px solid var(--ink);
        outline-offset: 2px;
      }
      .ch {
        display: inline-block;
        font-size: 13px;
        font-weight: 600;
        padding: 2px 8px;
        margin: 8px 6px 0 0;
        border: 1px solid var(--ln);
      }
      .up {
        color: #128a4a;
        border-color: #128a4a;
      }
      .dn {
        color: #d3302f;
        border-color: #d3302f;
      }
      .strip {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        margin: 8px 0;
      }
      .p {
        min-width: 34px;
        text-align: center;
        padding: 3px 4px;
        border: 1px solid var(--ln);
        font:
          700 12px Formula1,
          sans-serif;
        background: var(--pn);
      }
      .p.pd {
        background: var(--sc);
        color: #fff;
        border-color: var(--sc);
      }
      .p.x {
        color: #d3302f;
        border-color: #d3302f;
      }
      .big {
        font:
          700 clamp(40px, 12vw, 76px)/1.05 Formula1,
          sans-serif;
      }
      .st {
        display: flex;
        gap: 20px;
        flex-wrap: wrap;
        margin: 8px 0;
      }
      .st div b {
        display: block;
        font:
          700 21px Formula1,
          sans-serif;
      }
      .tw {
        overflow-x: auto;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 15px;
      }
      td,
      th {
        padding: 5px 8px;
        border-bottom: 1px solid var(--ln);
        text-align: left;
      }
      th {
        color: var(--mu);
        font-weight: 500;
      }
      tr.me {
        background: color-mix(in srgb, var(--sc) 18%, transparent);
        font-weight: 600;
      }
      input {
        font: inherit;
        width: 100%;
        padding: 11px;
        border: 1px solid var(--ln);
        background: var(--pn);
        color: var(--ink);
        margin: 6px 0 4px;
      }
      .grid {
        display: grid;
        gap: 10px;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        margin-top: 10px;
      }
      .grid .cb b {
        font:
          700 16px Formula1,
          sans-serif;
        display: block;
      }
      @media (prefers-reduced-motion: no-preference) {
        .pn {
          animation: in 0.25s ease-out;
        }
        @keyframes in {
          from {
            opacity: 0;
            transform: translateY(6px);
          }
        }
      }
      .lad {
        display: flex;
        gap: 6px;
        margin: 4px 0 8px;
        align-items: center;
      }
      .lk {
        margin-left: auto;
        background: none;
        border: 1px solid var(--ln);
        padding: 3px 12px;
        font:
          600 14px Barlow,
          sans-serif;
      }
      .cb.on {
        border-color: var(--sc);
        outline: 2px solid var(--sc);
      }
      .pg {
        height: 6px;
        background: var(--ln);
        margin: 6px 0 10px;
      }
      .pg i {
        display: block;
        height: 100%;
        background: var(--sc);
      }
      .tro.lock {
        opacity: 0.45;
        filter: grayscale(1);
      }
      .lad span {
        padding: 3px 14px;
        border: 1px solid var(--ln);
        font:
          700 13px Formula1,
          sans-serif;
        color: var(--mu);
      }
      .lad span.on {
        background: var(--c);
        border-color: var(--c);
        color: #fff;
      }
      .tb {
        display: inline-grid;
        place-items: center;
        flex: none;
        width: 40px;
        height: 40px;
        background: var(--tc);
        color: var(--tx, #fff);
        font:
          700 13px Formula1,
          sans-serif;
        clip-path: polygon(0 0, 100% 0, 100% 62%, 50% 100%, 0 62%);
        height: 46px;
        width: 40px;
        padding-bottom: 7px;
      }
      .tb.sm {
        width: 24px;
        height: 28px;
        font-size: 11px;
        padding-bottom: 4px;
      }
      .tn {
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .lk.on {
        background: var(--c);
        border-color: var(--c);
        color: #fff;
      }
      .tm {
        display: flex;
        gap: 12px;
        align-items: center;
        margin: 10px 0;
      }
      .tm img {
        margin-bottom: 4px !important;
      }
      .of {
        display: flex;
        gap: 12px;
        align-items: center;
      }
      .tg {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 6px;
      }
      .tg i,
      .tg em {
        font:
          600 12px Barlow,
          sans-serif;
        font-style: normal;
        padding: 1px 7px;
        border: 1px solid;
      }
      .tg .u {
        color: #128a4a;
      }
      .tg .d {
        color: #d3302f;
      }
      .tg em {
        color: var(--mu);
      }
      .dots {
        display: flex;
        align-items: center;
        gap: 6px;
        margin: 6px 0 12px;
        color: var(--mu);
        font-size: 14px;
      }
      .dots i {
        width: 22px;
        height: 6px;
        background: var(--ln);
      }
      .dots i.d {
        background: var(--sc);
      }
      .dots i.c {
        background: var(--ink);
      }
      .tl {
        display: inline-grid;
        place-items: center;
        flex: none;
        width: 52px;
        height: 34px;
        padding: 3px;
      }
      .tl img {
        max-width: 100%;
        max-height: 100%;
        object-fit: contain;
      }
      .tl.sm {
        width: 38px;
        height: 24px;
        padding: 2px;
      }
      .tl.lt img {
        filter: brightness(0.3);
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) .tl.dk img {
          filter: brightness(0) invert(0.93);
        }
        :root:not([data-theme="light"]) .tl.lt img {
          filter: none;
        }
      }
      :root[data-theme="dark"] .tl.dk img {
        filter: brightness(0) invert(0.93);
      }
      :root[data-theme="dark"] .tl.lt img {
        filter: none;
      }
      .p {
        display: inline-flex;
        flex-direction: column;
        align-items: center;
        gap: 1px;
        min-width: 46px;
      }
      .p small {
        font:
          600 10px Barlow,
          sans-serif;
        letter-spacing: 0.05em;
      }
      .fg {
        vertical-align: middle;
        border: 1px solid rgba(128, 128, 128, 0.4);
      }
      .paper {
        background: #f1ead7;
        color: #1d1b16;
        font-family: Georgia, "Times New Roman", serif;
        padding: 22px 20px;
        margin: 14px 0;
        border-radius: 2px;
        box-shadow: 0 8px 22px rgba(0, 0, 0, 0.4);
        position: relative;
        background-image: repeating-linear-gradient(
          transparent 0 27px,
          rgba(0, 0, 0, 0.05) 27px 28px
        );
      }
      .paper .ph {
        display: flex;
        gap: 12px;
        align-items: center;
        border-bottom: 2px solid #1d1b16;
        padding-bottom: 10px;
        margin-bottom: 12px;
      }
      .paper .ph b {
        display: block;
        font:
          700 15px Formula1,
          sans-serif;
        letter-spacing: 0.04em;
      }
      .paper .ph small {
        color: #5b564a;
        font-size: 13px;
      }
      .paper p {
        margin: 8px 0;
      }
      .paper ol {
        padding-left: 22px;
        line-height: 1.75;
        margin: 8px 0;
      }
      .paper li b {
        font-variant: small-caps;
      }
      .paper .sig {
        display: flex;
        gap: 22px;
        margin-top: 26px;
      }
      .paper .sig div {
        flex: 1;
        border-top: 1px solid #1d1b16;
        padding-top: 4px;
        font-size: 12px;
        color: #5b564a;
      }
      .paper .sig i {
        display: block;

      .f4g {

      .wk {

      .wk span {
        flex: 1;

        justify-content: center;
        margin: 14px 0;

      .lt i {

        height: 38px;

        border: 2px solid #555;

        border-color: #ff7a70;

      }
      .bk {
        position: relative;
        height: 30px;
        background: var(--ln);
        margin: 22px 0;
      }
      .bk i {
        position: absolute;
        top: 0;
        bottom: 0;
        background: #128a4a99;
      }
      .bk b {
        position: absolute;
        top: -6px;
        bottom: -6px;
        width: 6px;
        background: var(--ink);
        left: 0;
      }
      .lad {
        flex-wrap: wrap;
      }
      .ev {
        font-size: 22px;

      }
      .trk {

      }
      .paper li {
        margin: 6px 0;

      /* ===== REDISEÑO: base oscura estilo Copero + cortes y barra estilo F1.com ===== */
      :root {
        --bg: #f4f4f6;
        --pn: #fff;
        --ink: #15151e;
        --mu: #667085;
        --ln: #e2e2e8;
        --pn2: #f0f0f4;
        --r: 14px;
        --cut: 14px;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #15151e;
          --pn: #1c1c28;
          --pn2: #262634;
          --ink: #f5f5f7;
          --mu: #a3a3b5;
          --ln: #303042;
        }
      }
      :root[data-theme="dark"] {
        --bg: #15151e;
        --pn: #1c1c28;
        --pn2: #262634;
        --ink: #f5f5f7;
        --mu: #a3a3b5;
        --ln: #303042;
      }
      body {
        font:
          16px/1.55 Inter,
          "Akt Variable",
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
        background: var(--bg);
        background-image: radial-gradient(
          900px 380px at 85% -80px,
          color-mix(in srgb, var(--sc) 20%, transparent),
          transparent
        );
      }
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        opacity: 0.035;
        background: repeating-linear-gradient(
          135deg,
          currentColor 0 1px,
          transparent 1px 14px
        );
        z-index: -1;
      }
      .kerb {
        display: none;
      }
      .bar {
        position: sticky;
        top: 0;
        z-index: 20;
        background: #0a0a0c;
        color: #fff;
        border-bottom: 3px solid var(--sc);
      }
      .bar div {
        max-width: 960px;
        margin: 0 auto;
        padding: 0 16px;
        height: 54px;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .bar .lg {
        display: flex;
        align-items: center;
        gap: 10px;
        background: none;
        border: 0;
        color: #fff;
        font:
          italic 800 18px Formula1,
          "Barlow Condensed",
          sans-serif;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        padding: 0;
      }
      .bar .lg i {
        display: inline-block;
        width: 34px;
        height: 20px;
        background: var(--sc);
        transform: skewX(-24deg);
        position: relative;
      }
      .bar .lg i:before,
      .bar .lg i:after {
        content: "";
        position: absolute;
        top: 0;
        bottom: 0;
        width: 5px;
        background: #0a0a0c;
        left: 12px;
      }
      .bar .lg i:after {
        left: 21px;
        width: 3px;
      }
      .bar nav {
        margin-left: auto;
        display: flex;
        gap: 4px;
      }
      .bar button.nv {
        background: none;
        border: 0;
        color: #d4d4d8;
        font:
          700 12px Formula1,
          sans-serif;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        padding: 9px 12px;
        border-radius: 8px;
      }
      .bar button.nv:hover,
      .bar button.nv:focus-visible {
        background: #1f1f24;
        color: #fff;
        outline: 0;
      }
      main {
        max-width: 960px;
        padding: 26px 16px 72px;
      }
      h1 {
        font-style: italic;
        text-transform: uppercase;
        font-weight: 800;
        letter-spacing: -0.01em;
      }
      h2 {
        font-size: 26px;
        text-transform: uppercase;
        font-style: italic;
        font-weight: 800;
        letter-spacing: -0.005em;
        margin-bottom: 6px;
      }
      h2:after {
        content: "";
        display: block;
        width: 56px;
        height: 5px;
        background: var(--sc);
        margin-top: 8px;
        transform: skewX(-24deg);
      }
      h3 {
        font-size: 12px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--mu);
        margin: 26px 0 10px;
      }
      .lead {
        font-size: 19px;
      }
      .pn {
        background: var(--pn);
        border: 1px solid var(--ln);
        border-radius: var(--r);
        border-left: 0;
        position: relative;
        padding: 18px 18px 18px 24px;
        margin: 16px 0;
        box-shadow:
          0 1px 0 rgba(255, 255, 255, 0.03) inset,
          0 10px 30px -18px rgba(0, 0, 0, 0.6);
        overflow: hidden;
      }
      .pn:before {
        content: "";
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
        width: 6px;
        background: var(--sc);
      }
      .pn:after {
        content: "";
        position: absolute;
        right: 0;
        top: 0;
        width: var(--cut);
        height: var(--cut);
        background: linear-gradient(225deg, var(--bg) 50%, transparent 50%);
      }
      .top {
        padding-bottom: 10px;
        border-bottom: 1px solid var(--ln);
        margin-bottom: 6px;
        align-items: center;
      }
      .top b {
        font-size: 22px;
        font-style: italic;
        text-transform: uppercase;
        letter-spacing: 0.01em;
      }
      .tm {
        background: var(--pn2);
        border-radius: 12px;
        padding: 10px 12px;
        margin: 12px 0;
      }
      .tm b {
        font-size: 16px;
      }
      .m {
        grid-template-columns: 110px 1fr 34px;
        font-size: 13px;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        font-weight: 600;
        color: var(--mu);
      }
      .m i {
        height: 10px;
        border-radius: 99px;
        background: var(--pn2);
        overflow: hidden;
      }
      .m i:after {
        border-radius: 99px;
        background: linear-gradient(
          90deg,
          color-mix(in srgb, var(--sc) 70%, #000),
          var(--sc)
        );
      }
      .m b {
        color: var(--ink);
        font:
          800 15px Formula1,
          sans-serif;
      }
      .cb {
        border-radius: 12px;
        background: var(--pn);
        border: 1px solid var(--ln);
        padding: 15px 16px;
        margin: 10px 0;
        font-weight: 500;
        position: relative;
        transition:
          transform 0.12s,
          border-color 0.12s,
          background 0.12s;
      }
      .cb:hover,
      .cb:focus-visible {
        border-color: var(--sc);
        background: var(--pn2);
        outline: 0;
        transform: translateX(4px);
        box-shadow: -4px 0 0 var(--sc);
      }
      .cb.on {
        border-color: var(--sc);
        background: color-mix(in srgb, var(--sc) 14%, var(--pn));
        box-shadow: -4px 0 0 var(--sc);
        outline: 0;
      }
      .cb b {
        font-weight: 700;
      }
      .go {
        background: var(--sc);
        color: #fff;
        border: 0;
        border-radius: 10px;
        padding: 14px 28px;
        font:
          800 14px Formula1,
          sans-serif;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        clip-path: polygon(0 0, 100% 0, calc(100% - 14px) 100%, 0 100%);
        padding-right: 40px;
        transition:
          filter 0.12s,
          transform 0.12s;
      }
      .go:hover {
        filter: brightness(1.12);
        transform: translateX(3px);
      }
      .go:focus-visible {
        outline: 2px solid #fff;
        outline-offset: -4px;
      }
      .lk {
        border-radius: 99px;
        background: var(--pn2);
        border: 1px solid var(--ln);
        padding: 5px 14px;
        font:
          700 12px Inter,
          sans-serif;
        letter-spacing: 0.04em;
        margin: 3px 4px 3px 0;
        color: var(--ink);
      }
      .lk:hover {
        border-color: var(--sc);
        color: var(--sc);
      }
      .lk.on {
        background: var(--c);
        border-color: var(--c);
        color: #fff;
      }
      .ch {
        border-radius: 99px;
        padding: 3px 11px;
        font-weight: 700;
        background: color-mix(in srgb, currentColor 10%, transparent);
        border-color: transparent;
      }
      .ch:not(.up):not(.dn) {
        color: var(--mu);
      }
      .p {
        border-radius: 8px;
        background: var(--pn2);
        border-color: transparent;
      }
      .p.pd {
        background: var(--sc);
        color: #fff;
      }
      .big {
        font-style: italic;
        text-transform: uppercase;
        font-weight: 800;
        line-height: 1;
      }
      .st {
        gap: 12px;
        margin: 12px 0;
      }
      .st div {
        background: var(--pn2);
        border-radius: 12px;
        padding: 10px 16px;
        min-width: 92px;
        font-size: 11px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--mu);
      }
      .st div b {
        color: var(--ink);
        font-size: 26px;
        letter-spacing: 0;
        text-transform: none;
        margin-bottom: 2px;
      }
      .tw {
        border: 1px solid var(--ln);
        border-radius: 12px;
        background: var(--pn);
      }
      table {
        font-size: 14px;
      }
      th {
        font:
          700 11px Formula1,
          sans-serif;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        padding: 11px 10px;
        background: var(--pn2);
      }
      td {
        padding: 9px 10px;
      }
      tr:last-child td {
        border-bottom: 0;
      }
      tr.me {
        background: color-mix(in srgb, var(--sc) 20%, transparent);
        box-shadow: inset 4px 0 0 var(--sc);
      }
      tbody tr:hover {
        background: var(--pn2);
      }
      .grid {
        gap: 12px;
        grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
      }
      .grid .cb {
        margin: 0;
        padding: 16px;
        overflow: hidden;
      }
      .grid .cb:before {
        content: "";
        position: absolute;
        left: 0;
        right: 0;
        top: 0;
        height: 4px;
        background: var(--sc, var(--ln));
      }
      .grid .cb b {
        font-size: 15px;
        font-style: italic;
        text-transform: uppercase;
        margin-bottom: 4px;
      }
      .grid .cb:hover {
        transform: translateY(-3px);
        box-shadow: 0 14px 28px -16px rgba(0, 0, 0, 0.7);
      }
      .f4g {
        grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
        gap: 12px;
      }
      .f4c {
        border-radius: 14px;
        padding: 12px;
      }
      .f4l {
        border-radius: 10px;
      }
      .f4b {
        height: 6px;
        border-radius: 99px;
        overflow: hidden;
      }
      .f4b:after {
        border-radius: 99px;
      }
      .pg {
        height: 8px;
        border-radius: 99px;
        overflow: hidden;
        background: var(--pn2);
      }
      .pg i {
        border-radius: 99px;
        background: linear-gradient(
          90deg,
          color-mix(in srgb, var(--sc) 70%, #000),
          var(--sc)
        );
      }
      .lad {
        gap: 4px;
        margin: 0 0 14px;
        flex-wrap: wrap;
      }
      .lad span {
        border-radius: 8px;
        border: 0;
        background: var(--pn2);
        padding: 5px 14px;
        transform: skewX(-14deg);
      }
      .lad span.on {
        background: var(--c);
        color: #fff;
      }
      .dots i {
        height: 5px;
        border-radius: 99px;
      }
      .tb {
        filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.35));
      }
      input {
        border-radius: 10px;
        padding: 13px 14px;
        background: var(--pn2);
        border-color: var(--ln);
      }
      input:focus {
        outline: 2px solid var(--sc);
        border-color: var(--sc);
      }
      details {
        background: var(--pn2);
        border-radius: 10px;
        padding: 8px 12px;
      }
      summary {
        font-weight: 600;
      }
      .wk span {
        border-radius: 8px;
      }
      .paper {
        border-radius: 6px;
      }
      .mu {
        color: var(--mu);
      }
      .tn {
        background: var(--pn2);
        border-radius: 10px;
        padding: 8px 10px;
      }
      @media (max-width: 560px) {
        .bar button.nv {
          padding: 9px 8px;
          font-size: 11px;
        }
        .bar .lg span {
          display: none;
        }
        main {
          padding-top: 18px;
        }
        .m {
          grid-template-columns: 86px 1fr 30px;
        }
        .top b {
          font-size: 19px;
        }
        .go {
          width: 100%;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .cb,
        .go {
          transition: none;
        }
      }

      const tcol = (n) => {
        if (TC[n]) return TC[n];
        let h = 0;
        for (const c of n) h = (h * 31 + c.charCodeAt(0)) % 360;
        return `hsl(${h},55%,42%)`;
      };
      const badge = (n, sm) => {
        if (LG[n])
          return `<span class="tl${sm ? " sm" : ""} ${LK[n] || ""}"><img alt="${n}" src="${LG[n]}"></span>`;
        const c = tcol(n),
          w = n.split(" "),
          t = (
            w.length > 1
              ? w
                  .slice(0, 2)
                  .map((x) => x[0])
                  .join("")
              : n.slice(0, 3)
          ).toUpperCase(),
          m = c.match(/^#(..)(..)(..)$/),
          l = m
            ? (parseInt(m[1], 16) * 299 +
                parseInt(m[2], 16) * 587 +
                parseInt(m[3], 16) * 114) /
              1000
            : 0;
        return `<span class="tb${sm ? " sm" : ""}" style="--tc:${c};--tx:${l > 150 ? "#111" : "#fff"}">${t}</span>`;
      };

            od.forEach((di, p) => {
              if (sc[di] > -999) {
                if (p < PT(k).length) pts[di] += PT(k)[p];
                if (p === 0) w[di]++;
              }
            });
            pts[go[0]] += PP[k];
            snap.push([pts.slice(), w.slice()]);
          }
          o[k] = { D, snap };
        });
        return o;
      }
      function stand(k) {
        const N = CAL[k].length;
        let D, n;
        if (k === S.series) {
          n = SE.i;
          D = SE.D.map((d) => ({
            name: d.name,
            team: d.team,
            pts: d.pts,
            w: d.w,
            me: d.me,
          }));
        } else {
          const P = CAL[S.series].length;
          n =
            S.mode === "full" ? Math.round((SE.i / P) * N) : SE.i >= P ? N : 0;
          const sn = n ? SE.sim[k].snap[n - 1] : null;
          D = SE.sim[k].D.map((d, i) => ({
            name: d.name,
            team: d.team,
            pts: sn ? sn[0][i] : 0,
            w: sn ? sn[1][i] : 0,
          }));
        }
        D.sort((a, b) => b.pts - a.pts || b.w - a.w);
        const m = {};
        D.forEach((d) => {
          const t = m[d.team] || (m[d.team] = { team: d.team, pts: 0, w: 0 });
          t.c = (t.c || 0) + 1;
          if (k === "f4" && F4.cur.t2 && t.c > 2) return;
          t.pts += d.pts;
          t.w += d.w;
        });
        return {
          D,
          T: Object.values(m).sort((a, b) => b.pts - a.pts || b.w - a.w),
          n,
          N,
        };
      }
      const teamRows = (n) => {
        const T = stand(S.series).T,
          k = T.findIndex((t) => t.team === S.team),
          r = (t, i) =>
            `<tr class="${t.team === S.team ? "me" : ""}"><td style="border-left:4px solid ${tcol(t.team)}">${i + 1}</td><td><span class="tn">${badge(t.team, 1)}${t.team}</span></td><td>${t.pts}</td></tr>`;
        return `<h3>Constructores</h3><div class="tw"><table><tr><th>Pos</th><th>Equipo</th><th>Pts</th></tr>${T.slice(0, n).map(r).join("")}${k >= n ? r(T[k], k) : ""}</table></div>`;
      };
      function champ(k) {
        k = k || S.series;
        const X = SERIES[k],
          st = stand(k),
          me = k === S.series;
        const tabs = ["f4", "f3", "f2", "f1", "fe"]
          .map(
            (c) =>
              `<a class="${c === k ? "on" : ""}" style="--c:${SERIES[c].col}" href="javascript:void(0)" role="button" onclick="champ('${c}')" title="${SERIES[c].n}">${LOGO[c] || c === "f4" ? `<img src="${c === "f4" ? F4GEN : LOGO[c]}" alt="${SERIES[c].n}">` : SERIES[c].n.replace("Fórmula ", "F")}</a>`,
          )
          .join("");
        const dr = st.D.map(
          (d, i) =>
            `<tr class="${d.me ? "me" : ""}"><td style="border-left:4px solid ${tcol(d.team)}">${i + 1}</td><td>${d.name}</td><td><span class="tn">${badge(d.team, 1)}${d.team}</span></td><td>${d.pts}</td></tr>`,
        ).join("");
        const tr = st.T.map(
          (t, i) =>
            `<tr class="${me && t.team === S.team ? "me" : ""}"><td style="border-left:4px solid ${tcol(t.team)}">${i + 1}</td><td><span class="tn">${badge(t.team, 1)}${t.team}</span></td><td>${t.pts}</td></tr>`,
        ).join("");
        const hh = S.cham
          .filter((h) => h[k])
          .map(
            (h) =>
              `<tr><td style="border-left:4px solid ${tcol(h[k].t)}">${h.y - 1}</td><td>${h[k].d}</td>${TT(h[k].t)}</tr>`,
          )
          .join("");
        document.documentElement.style.setProperty("--sc", X.col);
        $("#app").innerHTML =
          `<h2>Campeonatos</h2><div class="lad" style="margin-top:10px">${tabs}</div>${logo(k, 30)}<p class="mu">${st.n ? `Tras ${st.n} de ${st.N} rondas.` : "Todavía no se corrió ninguna ronda."}${me ? "" : " Temporada simulada: no corrés en esta categoría."}</p>
<h3>Pilotos</h3><div class="tw"><table><tr><th>Pos</th><th>Piloto</th><th>Equipo</th><th>Pts</th></tr>${dr}</table></div>
<h3>Constructores</h3><div class="tw"><table><tr><th>Pos</th><th>Equipo</th><th>Pts</th></tr>${tr}</table></div>
${hh ? `<h3>Campeones anteriores</h3><div class="tw"><table><tr><th>Año</th><th>Piloto</th><th>Constructor</th></tr>${hh}</table></div>` : ""}
<button class="go" onclick="back()">Volver</button>`;
        window.scrollTo(0, 0);
      }
      function back() {
        if (S) col();
        R_(LASTH);

      let LANG = (() => {
          try {
            const l = localStorage.getItem("pp_lang");
            return ["mx", "ar", "en", "pt"].includes(l) ? l : "mx";

        })(),
        SND = (() => {

          } catch (e) {
            return false;

        })(),
        RP = null;
      const IRR = {
          tenés: "tienes",
          querés: "quieres",
          podés: "puedes",
          perdés: "pierdes",
          volvés: "vuelves",

          cerrás: "cierras",
          pensás: "piensas",
          empezás: "empiezas",
          mostrás: "muestras",
          movés: "mueves",
          resolvés: "resuelves",
          volás: "vuelas",

          juntá: "junta",
          abrí: "abre",
          definí: "define",
          tomá: "toma",
          asumí: "asume",
          construí: "construye",
          repetí: "repite",
          copiá: "copia",
          pegá: "pega",
          tocá: "toca",
          esperá: "espera",
          reaccioná: "reacciona",
          frená: "frena",
          mové: "mueve",

        },
        NOT =
          /^(más|después|atrás|demás|país|interés|desinterés|además|detrás|estás|inglés|francés|japonés|holandés|portugués|danés|través|revés|nicolás|tomás|lucás|matías|andrés|inés|parís|jesús)$/i,
        cs = (a, b) =>
          a[0] !== a[0].toLowerCase() ? b[0].toUpperCase() + b.slice(1) : b,
        mx = (s) =>
          s

            )
            .replace(/[A-Za-zÁÉÍÓÚáéíóúñ]+/g, (w) => {

{v:"1.26",d:"20/11/2026",es:["F1 Academy: corregido de verdad el nombre al ascender a Fórmula 4. Al elegir el campeonato de F4 se perdían tu nombre, edad, reputación, dinero, nacionalidad y puntos de superlicencia, y el contrato decía solo \u201cPiloto\u201d. Ahora todo se conserva."],pt:["F1 Academy: corrigido de verdade o nome ao subir para a Fórmula 4. Ao escolher o campeonato de F4 perdiam-se seu nome, idade, reputação, dinheiro, nacionalidade e pontos de superlicença, e o contrato dizia só \u201cPiloto\u201d. Agora tudo é mantido."],en:["F1 Academy: properly fixed the driver's name when moving up to Formula 4. Choosing the F4 championship used to lose your name, age, reputation, cash, nationality and Super Licence points, and the contract read just \u201cPiloto\u201d. Everything is now kept."]},
{v:"1.25",d:"20/11/2026",es:["F1 Academy: corregido el nombre de la piloto al ascender a F4, F3, F2 o F1. Antes aparecía solo como \u201cPiloto\u201d (por ejemplo en el contrato). Ahora podés escribir tu nombre al empezar en F1 Academy y se conserva en toda tu carrera.","Las chances de ascender desde F1 Academy no cambiaron: F4 es posible, F3 es muy baja, F2 casi imposible y F1 casi casi imposible."],pt:["F1 Academy: corrigido o nome da piloto ao subir para F4, F3, F2 ou F1. Antes aparecia só como \u201cPiloto\u201d (por exemplo no contrato). Agora você pode escrever seu nome ao começar na F1 Academy e ele é mantido em toda a carreira.","As chances de ascender da F1 Academy não mudaram: F4 é possível, F3 é muito baixa, F2 quase impossível e F1 quase quase impossível."],en:["F1 Academy: fixed the driver's name when moving up to F4, F3, F2 or F1. It used to show only as \u201cPiloto\u201d (for example on the contract). You can now type your name when starting in F1 Academy and it carries through your whole career.","Promotion odds out of F1 Academy are unchanged: F4 is possible, F3 is very low, F2 almost impossible and F1 almost almost impossible."]},
{v:"1.24",d:"20/11/2026",es:["Modo gestión (Fundador): corregido el premio de fin de temporada, que era demasiado chico y casi no se notaba. Ahora el premio de constructores crece mucho con la posición: el campeón cobra 10 veces el pago base de la categoría (€400 M en F1) y el último, 1,5 veces.","El balance de fin de temporada ahora muestra cuánto tenías antes y cuánto tenés después (Fondos: antes → después)."],pt:["Modo gestão (Fundador): corrigido o prêmio de fim de temporada, que era pequeno demais e quase não se notava. Agora o prêmio de construtores cresce muito com a posição: o campeão recebe 10 vezes o pagamento base da categoria (€400 M na F1) e o último, 1,5 vez.","O balanço de fim de temporada agora mostra quanto você tinha antes e quanto tem depois (Fundos: antes → depois)."],en:["Management mode (Founder): fixed the end-of-season prize, which was too small to notice. The constructors' prize now grows steeply with position: the champion earns 10 times the category's base pay (€400 M in F1) and last place 1.5 times.","The end-of-season balance now shows your funds before and after (Funds: before → after)."]},
{v:"1.23",d:"20/11/2026",es:["Talentos: ahora es posible completar el árbol. Además del punto base por temporada, ganás puntos extra por tus resultados: terminar entre los 3 primeros suma +1 y ser campeón suma +3 (+2 en F4 y F3).","Balance: con una carrera dominante llegás a la Leyenda viviente en unas 13 temporadas; si terminás siempre entre los 3 primeros sin ganar, en unas 18; y si te quedás en mitad de tabla no alcanza para todo. Rápido, pero difícil.","Las carreras ya empezadas reciben retroactivamente los puntos extra por su historial de temporadas.","Al cerrar la temporada se avisa cuántos puntos de talento extra ganaste."],pt:["Talentos: agora é possível completar a árvore. Além do ponto base por temporada, você ganha pontos extras pelos resultados: terminar entre os 3 primeiros dá +1 e ser campeão dá +3 (+2 na F4 e na F3).","Balanceamento: com uma carreira dominante você chega à Lenda viva em cerca de 13 temporadas; se terminar sempre entre os 3 primeiros sem vencer, em cerca de 18; e se ficar no meio da tabela não dá para tudo. Rápido, mas difícil.","As carreiras já iniciadas recebem retroativamente os pontos extras pelo histórico de temporadas.","Ao fechar a temporada, é informado quantos pontos de talento extras você ganhou."],en:["Talents: the tree can now be completed. On top of the base point per season, you earn extra points for your results: finishing in the top 3 gives +1 and winning the title gives +3 (+2 in F4 and F3).","Balance: with a dominant career you reach Living legend in about 13 seasons; if you always finish in the top 3 without winning, in about 18; and if you stay mid-table you can't afford everything. Fast, but hard.","Careers already in progress get the extra points retroactively for their season history.","At the end of each season you are told how many extra talent points you earned."]},
{v:"1.22",d:"20/11/2026",es:["Talentos rediseñados como un árbol visual de 4 ramas (Ritmo, Carrera, Regularidad e Imagen) con una cima final. Cada talento desbloquea el siguiente, así que vas abriendo habilidades poco a poco.","Nuevas habilidades con efecto real en carrera: mejor clasificación, más rendimiento bajo lluvia, remontadas desde el fondo de la parrilla, menos desgaste de gomas, menos errores, fallas mecánicas y sanciones, y más ingresos y reputación.","Balance: los puntos siguen siendo 1 por temporada, pero ya no alcanzan para todo (el árbol completo cuesta 36). Hay que especializarse; las cimas cuestan 3 puntos y la Leyenda viviente pide 2 cimas.","Podés reasignar tu árbol por dinero (el costo depende de la categoría).","Tus talentos anteriores se reinician: se te devuelven los puntos gastados y se quitan sus bonos para que los uses en el árbol nuevo."],pt:["Talentos redesenhados como uma árvore visual de 4 ramos (Ritmo, Corrida, Regularidade e Imagem) com um topo final. Cada talento desbloqueia o seguinte, então você abre habilidades aos poucos.","Novas habilidades com efeito real na corrida: melhor classificação, mais desempenho na chuva, recuperações saindo do fundo do grid, menos desgaste dos pneus, menos erros, falhas mecânicas e punições, e mais renda e reputação.","Balanceamento: os pontos continuam sendo 1 por temporada, mas não bastam para tudo (a árvore completa custa 36). É preciso se especializar; os topos custam 3 pontos e a Lenda viva exige 2 topos.","Você pode reatribuir sua árvore por dinheiro (o custo depende da categoria).","Seus talentos anteriores são reiniciados: os pontos gastos são devolvidos e seus bônus removidos para você usá-los na nova árvore."],en:["Talents redesigned as a visual tree with 4 branches (Pace, Racecraft, Consistency and Image) and a final summit. Each talent unlocks the next one, so you open up abilities little by little.","New abilities with a real effect on the race: better qualifying, more pace in the rain, comebacks from the back of the grid, less tyre wear, fewer mistakes, mechanical failures and penalties, and more income and reputation.","Balance: points are still 1 per season, but they no longer cover everything (the full tree costs 36). You have to specialize; summits cost 3 points and the Living legend needs 2 summits.","You can respec your tree for money (the cost depends on the category).","Your previous talents are reset: spent points are refunded and their bonuses removed so you can use them on the new tree."]},
{v:"1.21",d:"20/11/2026",es:["Balance de inversiones: las mejoras eran demasiado baratas y se maxeaban en pocas temporadas.","Preparador, ingeniero y simulador: el costo ahora crece de forma exponencial con cada nivel (antes subía muy poco) y solo podés subir 1 nivel de cada uno por temporada.","Los precios ya no se vuelven irrisorios en Fórmula 4 y Fórmula 3: tienen un piso mínimo para que los premios fijos de eventos no alcancen para comprarlo todo.","Paquete técnico privado y Comprar acciones del equipo cuestan bastante más; las acciones suben mucho de precio con cada compra.","Fundación e imagen pública cuesta más cuanta más reputación tenés y ahora da +3 de reputación (antes +4)."],pt:["Balanceamento dos investimentos: as melhorias eram baratas demais e eram maximizadas em poucas temporadas.","Preparador, engenheiro e simulador: o custo agora cresce de forma exponencial a cada nível (antes subia muito pouco) e você só pode subir 1 nível de cada um por temporada.","Os preços não ficam mais irrisórios na Fórmula 4 e na Fórmula 3: há um piso mínimo para que os prêmios fixos de eventos não bastem para comprar tudo.","Pacote técnico privado e Comprar ações da equipe custam bem mais; as ações ficam muito mais caras a cada compra.","Fundação e imagem pública custa mais quanto maior a sua fama e agora dá +3 de reputação (antes +4)."],en:["Investment balance: upgrades were too cheap and got maxed out in just a few seasons.","Trainer, engineer and simulator: cost now grows exponentially with each level (it used to barely rise) and you can only buy 1 level of each per season.","Prices no longer become trivial in Formula 4 and Formula 3: there is a minimum floor so fixed event rewards can't buy everything.","Private technical package and Buy team shares cost considerably more; shares get much pricier with each purchase.","Foundation and public image costs more the more famous you are and now gives +3 reputation (was +4)."]},
{v:"1.20",d:"20/11/2026",es:["Corregido: en la revista, tus títulos de campeón ahora se tienen en cuenta. Antes la nota de tu campeonato podía quedar fuera de las noticias principales; ahora siempre aparece en la revista, y en portada cuando es de las más importantes."],pt:["Corrigido: na revista, seus títulos de campeão agora são levados em conta. Antes a notícia do seu campeonato podia ficar fora das principais; agora ela sempre aparece na revista, e na capa quando é uma das mais importantes."],en:["Fixed: in the magazine, your championship titles are now taken into account. Before, the story about your title could get left out of the main news; now it always appears in the magazine, and on the cover when it is one of the biggest stories."]},
{v:"1.19",d:"20/11/2026",es:["Nuevo: cuentas en la nube. Creá tu cuenta con correo o con Google desde el botón «Cuenta» de la barra superior.","Tus partidas (autoguardado y los 3 espacios), el salón de la fama y los trofeos se guardan en la nube, así que podés seguir tu carrera desde otro dispositivo.","Estadísticas de tu cuenta: puntos totales, victorias, podios, poles, títulos y temporadas de todas tus carreras.","Nuevo ranking global con los pilotos que más puntos acumulan.","Nueva revista de noticias antes de cada temporada: campeonatos, fichajes, ascensos, renovaciones, retiros y debutantes de todas las categorías, con las más importantes en portada y filtros por categoría.","Encabezado rediseñado: tu avatar, un indicador de sincronización con la nube y accesos con íconos.","Política de privacidad actualizada con los datos de la cuenta. Podés eliminar tu cuenta y tus datos en la nube desde tu perfil."],pt:["Novo: contas na nuvem. Crie sua conta com e-mail ou com o Google no botão «Conta» da barra superior.","Seus jogos (salvamento automático e os 3 espaços), o hall da fama e os troféus ficam salvos na nuvem, então você pode continuar sua carreira em outro dispositivo.","Estatísticas da sua conta: pontos totais, vitórias, pódios, poles, títulos e temporadas de todas as suas carreiras.","Novo ranking global com os pilotos que mais acumulam pontos.","Nova revista de notícias antes de cada temporada: campeonatos, contratações, promoções, renovações, aposentadorias e estreantes de todas as categorias, com as mais importantes na capa e filtros por categoria.","Cabeçalho redesenhado: seu avatar, um indicador de sincronização com a nuvem e atalhos com ícones.","Política de privacidade atualizada com os dados da conta. Você pode excluir sua conta e seus dados na nuvem pelo seu perfil."],en:["New: cloud accounts. Create your account with email or Google from the «Account» button in the top bar.","Your games (autosave and the 3 slots), hall of fame and trophies are saved in the cloud, so you can continue your career on another device.","Account stats: total points, wins, podiums, poles, titles and seasons across all your careers.","New global leaderboard with the pilots who have earned the most points.","New news magazine before every season: championships, signings, promotions, renewals, retirements and debutants from every category, with the biggest stories on the cover and category filters.","Redesigned header: your avatar, a cloud sync indicator and icon shortcuts.","Privacy policy updated with account data. You can delete your account and your cloud data from your profile."]},
{v:"1.18",d:"19/11/2026",es:["Corregido: F1 Academy ahora se guarda. Hay autoguardado al inicio de cada ronda y podés guardar a mano en los 3 espacios, además de exportar e importar la partida.","Corregido: el botón «Cerrar el fin de semana» de F1 Academy ya funciona.","Corregido: en F1 Academy los puntos se reinician al empezar la segunda temporada.","Corregido: en F1 Academy se muestra la bandera de tu nacionalidad en las tablas."],pt:["Corrigido: a F1 Academy agora é salva. Há salvamento automático no início de cada rodada e você pode salvar manualmente nos 3 espaços, além de exportar e importar o jogo.","Corrigido: o botão «Encerrar o fim de semana» da F1 Academy agora funciona.","Corrigido: na F1 Academy os pontos são zerados no início da segunda temporada.","Corrigido: na F1 Academy a bandeira da sua nacionalidade aparece nas tabelas."],en:["Fixed: F1 Academy now saves. There is an autosave at the start of every round and you can save manually in the 3 slots, as well as export and import your game.","Fixed: the \"Close the weekend\" button in F1 Academy now works.","Fixed: in F1 Academy the points reset when the second season starts.","Fixed: in F1 Academy your nationality flag shows in the tables."]},
{v:"1.17",d:"19/11/2026",es:["Nuevo modo: F1 Academy, el campeonato monomarca femenino. Está en la pantalla de inicio, debajo de la Fórmula E.","Parrilla y calendario 2026 reales: 6 equipos (PREMA, Campos, MP, Rodin, ART y Hitech), 17 pilotos y tu asiento libre en Hitech, con 7 rondas (Shanghai, Jeddah, Montreal, Silverstone, Zandvoort, Austin y Las Vegas).","Reglamento de la categoría: edad de 16 a 25 años, máximo de 2 temporadas (con una excepción muy rara), fines de semana de 2 carreras (Parrilla Invertida y Principal) o 3 en Montreal y Austin (con Opening Race), pole y vuelta rápida, y los puntos de superlicencia para las 5 mejores.","Juegos interactivos: vuelta de clasificación por sectores, luces de salida con reacción y decisiones de equipo en cada ronda. También hay pretemporada, test privados y la elección de tu origen y tu respaldo.","Ascensos muy limitados: F4 es posible, F3 muy poco probable, F2 casi imposible y F1 casi casi imposible. La campeona recibe financiamiento y, si asciende, continúa su carrera en el juego normal."],pt:["Novo modo: F1 Academy, o campeonato monomarca feminino. Está na tela inicial, abaixo da Fórmula E.","Grid e calendário 2026 reais: 6 equipes (PREMA, Campos, MP, Rodin, ART e Hitech), 17 pilotos e a sua vaga livre na Hitech, com 7 etapas (Xangai, Jidá, Montreal, Silverstone, Zandvoort, Austin e Las Vegas).","Regulamento da categoria: idade de 16 a 25 anos, máximo de 2 temporadas (com uma exceção muito rara), fins de semana de 2 corridas (Grid Invertido e Principal) ou 3 em Montreal e Austin (com Opening Race), pole e volta mais rápida, e pontos de superlicença para as 5 melhores.","Jogos interativos: volta de classificação por setores, luzes de largada com reação e decisões de equipe em cada etapa. Também há pré-temporada, testes privados e a escolha da sua origem e do seu apoio.","Ascensos muito limitados: F4 é possível, F3 muito improvável, F2 quase impossível e F1 quase quase impossível. A campeã recebe financiamento e, se subir, continua a carreira no jogo normal."],en:["New mode: F1 Academy, the all-female single-make championship. It sits on the home screen, below Formula E.","Real 2026 grid and calendar: 6 teams (PREMA, Campos, MP, Rodin, ART and Hitech), 17 drivers and your open seat at Hitech, over 7 rounds (Shanghai, Jeddah, Montreal, Silverstone, Zandvoort, Austin and Las Vegas).","Series rules: ages 16 to 25, a maximum of 2 seasons (with one very rare exception), 2-race weekends (Reverse Grid and Feature) or 3 at Montreal and Austin (with an Opening Race), pole and fastest lap points, and Super Licence points for the top 5.","Interactive games: a sector-by-sector qualifying lap, a reaction-based race start and team decisions every round. Also pre-season training, private tests, and choosing your background and backing.","Very limited promotion: F4 is possible, F3 very unlikely, F2 almost impossible and F1 almost almost impossible. The champion gets funding and, if promoted, continues in the regular game."]},
{v:"1.16",d:"18/11/2026",es:["Nueva opción al retirarte: fundar tu propio equipo. Diseñás el nombre y el logo (forma, patrón, elemento, texto y colores) con vista previa en vivo.","Elegís la categoría donde compite y, en F4, cuál de los 9 campeonatos. También elegís con qué estructura y presupuesto arrancás.","Multicategoría: podés abrir hasta 3 equipos de tu escudería en categorías distintas y gestionarlos en paralelo. Cada uno tiene su auto, pilotos y desarrollo; el dinero, la reputación y la academia son compartidos.","Se gestiona igual que el modo dueño de equipo, con todas sus opciones."],pt:["Nova opção ao se aposentar: fundar sua própria equipe. Você desenha o nome e o logo (forma, padrão, elemento, texto e cores) com prévia ao vivo.","Escolhe a categoria em que compete e, na F4, qual dos 9 campeonatos. Também escolhe a estrutura e o orçamento iniciais.","Multicategoria: você pode abrir até 3 equipes da sua escuderia em categorias diferentes e geri-las em paralelo. Cada uma tem seu carro, pilotos e desenvolvimento; dinheiro, reputação e academia são compartilhados.","Funciona como o modo dono de equipe, com todas as suas opções."],en:["New option when you retire: found your own team. Design the name and logo (shape, pattern, element, text and colours) with a live preview.","Choose the category it competes in and, in F4, which of the 9 championships. You also pick your starting structure and budget.","Multi-category: open up to 3 teams of your organisation in different categories and manage them in parallel. Each has its own car, drivers and development; money, reputation and the academy are shared.","It is managed like team owner mode, with all its options."]},
{v:"1.15",d:"18/11/2026",es:["Modo dueño de equipo mucho más completo: academia de pilotos con promesas que podés entrenar, subir a titular o vender (y rivales que intentan robártelas), y una filial en una categoría baja.","Finanzas con préstamos con intereses, inversores que compran parte del equipo y tope de costos con multas.","Proveedor de motor (cliente o fábrica propia), mercado de ingenieros con personalidad, marca y fans con mercadería y eventos VIP.","Crisis y votaciones de reglamento, metas a varias temporadas con recompensa, y un nuevo escenario de inicio: heredar un equipo en quiebra.","Cinco Grandes Premios por temporada con clasificación previa, campeonato de pilotos aparte y un salón de la fama de dueños."],pt:["Modo dono de equipe muito mais completo: academia de pilotos com promessas que você pode treinar, promover a titular ou vender (e rivais que tentam roubá-las), e uma filial em uma categoria de base.","Finanças com empréstimos com juros, investidores que compram parte da equipe e teto de custos com multas.","Fornecedor de motor (cliente ou fábrica própria), mercado de engenheiros com personalidade, marca e fãs com produtos e eventos VIP.","Crises e votações de regulamento, metas de várias temporadas com recompensa e um novo cenário inicial: herdar uma equipe falida.","Cinco Grandes Prêmios por temporada com classificação, campeonato de pilotos separado e um hall da fama de donos."],en:["Much more complete team owner mode: a driver academy with prospects you can train, promote or sell (and rivals trying to poach them), plus a feeder team in a lower category.","Finances with interest-bearing loans, investors who buy part of the team, and a cost cap with fines.","Engine supplier (customer or own factory), an engineer market with personalities, and brand and fans with merchandise and VIP events.","Crises and regulation votes, multi-season goals with rewards, and a new starting scenario: inherit a bankrupt team.","Five Grands Prix per season with qualifying, a separate drivers' championship and an owners' hall of fame."]},
{v:"1.14",d:"17/11/2026",es:["Gestión de equipo mucho más profunda: nuevo plan técnico donde repartís puntos de desarrollo entre aerodinámica, unidad de potencia, chasis y fiabilidad (con riesgo de que alguna mejora no funcione).","Tres Grandes Premios por temporada para jugar: cada circuito premia áreas distintas y vos elegís neumáticos, modo de motor y reglaje, y resolvés una decisión en plena carrera (safety car, lluvia, fallas del motor, órdenes de equipo).","El rendimiento en esos Grandes Premios influye en la clasificación final de constructores. Aplica a dueño y director de equipo."],pt:["Gestão de equipe muito mais profunda: novo plano técnico para distribuir pontos de desenvolvimento entre aerodinâmica, unidade de potência, chassi e confiabilidade (com risco de alguma melhoria não funcionar).","Três Grandes Prêmios por temporada para jogar: cada circuito premia áreas diferentes e você escolhe pneus, modo do motor e acerto, e resolve uma decisão em plena corrida (safety car, chuva, falhas do motor, ordens de equipe).","O desempenho nesses Grandes Prêmios influencia a classificação final de construtores. Vale para dono e diretor de equipe."],en:["Much deeper team management: a new technical plan where you spread development points across aerodynamics, power unit, chassis and reliability (with a risk that some upgrades don't work).","Three playable Grands Prix per season: each circuit rewards different areas, you choose tyres, engine mode and setup, and make a call mid-race (safety car, rain, engine trouble, team orders).","Your performance in those races affects the final constructors' standings. Applies to team owner and team principal."]},
{v:"1.13",d:"17/11/2026",es:["Corregido el contrato firmado: se veía oscuro, con el texto centrado, los títulos cortados en líneas sueltas y las firmas casi invisibles. Ahora se muestra como una hoja de papel con texto legible y el sello de FIRMADO."],pt:["Corrigido o contrato assinado: aparecia escuro, com o texto centralizado, os títulos quebrados em linhas soltas e as assinaturas quase invisíveis. Agora é exibido como uma folha de papel com texto legível e o carimbo de ASSINADO."],en:["Fixed the signed contract: it appeared dark, with centered text, headings broken onto separate lines and almost invisible signatures. It now shows as a sheet of paper with readable text and the SIGNED stamp."]},
{v:"1.12",d:"17/11/2026",es:["Nuevo contrato de piloto con diseño de documento: cláusulas numeradas (duración, remuneración, bonificación por podio y por victoria, prima de firma y cláusula de salida), firmas del piloto y del equipo, y sello de FIRMADO al aceptar."],pt:["Novo contrato de piloto com visual de documento: cláusulas numeradas (duração, remuneração, bônus por pódio e por vitória, prêmio de assinatura e cláusula de saída), assinaturas do piloto e da equipe e carimbo de ASSINADO ao aceitar."],en:["New driver contract styled as a document: numbered clauses (duration, pay, podium and win bonuses, signing bonus and exit clause), signatures from the driver and the team, and a SIGNED stamp once accepted."]},
{v:"1.11",d:"17/11/2026",es:["Pantalla de inicio rediseñada: las categorías ahora forman una escalera con la Fórmula 1 arriba y la F4 abajo (la Fórmula E queda aparte), con un diseño más limpio inspirado en tu logo.","La barra superior muestra el logo oficial de Pole Position.","Fórmula E para veteranos: desde los 34 años, si venís de F1 o F2 siempre recibís ofertas de Fórmula E, de equipos de menor nivel, para que puedas correr unas temporadas más antes de retirarte.","Salón de la fama: ahora podés abrir cada carrera y ver su historial deportivo completo, con categoría, equipo, posición y puntos de cada temporada. Las carreras guardadas antes de esta versión solo muestran el resumen.","Mi vitrina: las copas de F4 ahora indican en qué campeonato se ganaron (F4 Italiana, Alemana, etc.)."],pt:["Tela inicial redesenhada: as categorias agora formam uma escada com a Fórmula 1 em cima e a F4 embaixo (a Fórmula E fica à parte), com um visual mais limpo inspirado no seu logotipo.","A barra superior mostra o logotipo oficial do Pole Position.","Fórmula E para veteranos: a partir dos 34 anos, se você vem da F1 ou da F2, sempre recebe ofertas da Fórmula E, de equipes de nível menor, para poder correr mais algumas temporadas antes de se aposentar.","Hall da fama: agora você pode abrir cada carreira e ver o histórico esportivo completo, com categoria, equipe, posição e pontos de cada temporada. As carreiras salvas antes desta versão mostram só o resumo.","Minha vitrine: as taças da F4 agora indicam em qual campeonato foram conquistadas (F4 Italiana, Alemã, etc.)."],en:["Redesigned home screen: the categories now form a ladder with Formula 1 at the top and F4 at the bottom (Formula E sits apart), with a cleaner look inspired by your logo.","The top bar now shows the official Pole Position logo.","Formula E for veterans: from age 34, if you come from F1 or F2 you always get Formula E offers, from lower-level teams, so you can race a few more seasons before retiring.","Hall of fame: you can now open each career and see its full sports history, with the category, team, position and points of every season. Careers saved before this version only show the summary.","My trophy cabinet: F4 trophies now show which championship they were won in (Italian F4, German F4, etc.)."]},
{v:"1.10",d:"17/11/2026",es:["La parrilla de F1 es más pareja: la diferencia entre los equipos de arriba y los de abajo es mucho menor.","Al buscar equipo en F1 ahora recibís más ofertas y de equipos más variados, no solo del mejor auto."],pt:["O grid da F1 está mais equilibrado: a diferença entre as equipes de cima e as de baixo é bem menor.","Ao procurar equipe na F1 agora você recebe mais ofertas e de equipes mais variadas, não só da de melhor carro."],en:["The F1 grid is more even: the gap between the top and bottom teams is much smaller.","When looking for a team in F1 you now get more offers, from a wider range of teams, not just the best car."]},
{v:"1.9",d:"17/11/2026",es:["Aviso de actualización: cuando hay una versión nueva, la página te avisa y te muestra qué cambió."],pt:["Aviso de atualização: quando há uma versão nova, a página avisa você e mostra o que mudou."],en:["Update notice: when there is a new version, the page lets you know and shows what changed."]},
{v:"1.8",d:"17/11/2026",es:["Balance de inversiones: el Paquete técnico privado ahora da +2 de auto (antes +4) y cuesta más; Comprar acciones del equipo da +1 de nivel base (antes +2), tiene un máximo de 3 compras (antes 5) y su precio sube más rápido.","Las pestañas de Campeonatos ahora muestran los logos de cada categoría."],pt:["Equilíbrio dos investimentos: o Pacote técnico privado agora dá +2 de carro (antes +4) e custa mais; Comprar ações da equipe dá +1 de nível base (antes +2), tem máximo de 3 compras (antes 5) e o preço sobe mais rápido.","As abas de Campeonatos agora mostram os logotipos de cada categoria."],en:["Investment balance: the Private technical package now gives +2 car (was +4) and costs more; Buying team shares gives +1 base level (was +2), is capped at 3 purchases (was 5) and its price rises faster.","The Championships tabs now show each category\u2019s logos."]},
{v:"1.7",d:"17/11/2026",es:["Los botones de categoría dentro de la temporada ahora abren el campeonato actual de cada categoría (pilotos y constructores). Los de la cabecera siguen llevando a las páginas oficiales.","El logo de F4 ahora es el nuevo, sin fondo."],pt:["Os botões de categoria durante a temporada agora abrem o campeonato atual de cada categoria (pilotos e construtores). Os do cabeçalho continuam levando às páginas oficiais.","O logotipo da F4 agora é o novo, sem fundo."],en:["The category buttons during the season now open each category\u2019s current championship (drivers and constructors). The header ones still go to the official sites.","The F4 logo is now the new one, without a background."]},
{v:"1.6.1",d:"17/11/2026",es:["Miles de decisiones nuevas generadas al momento: las situaciones, las opciones y los riesgos cambian cada vez, así que no hay una opción que siempre convenga. Los minijuegos interactivos no cambian."],pt:["Milhares de decisões novas geradas na hora: situações, opções e riscos mudam a cada vez, então não existe uma opção que sempre compense. Os minijogos interativos não mudam."],en:["Thousands of new decisions generated on the fly: situations, options and risks change every time, so no single choice is always best. Interactive minigames are unchanged."]},
{v:"1.6",d:"17/11/2026",es:["La barra F4 · F3 · F2 · F1 · Fórmula E ahora usa los logos de cada categoría y enlaza a su página oficial (F4 a Wikipedia).","Nueva ventana para aceptar la política de privacidad."],pt:["A barra F4 · F3 · F2 · F1 · Fórmula E agora usa os logotipos de cada categoria e leva à página oficial (F4 para a Wikipédia).","Nova janela para aceitar a política de privacidade."],en:["The F4 · F3 · F2 · F1 · Formula E bar now uses each category\u2019s logo and links to its official site (F4 to Wikipedia).","New window to accept the privacy policy."]},
{v:"1.5",d:"17/11/2026",es:["Se quitó el menú de dificultad duplicado del inicio.","Más de 90 nacionalidades con su bandera, y la lista se traduce según el idioma elegido."],pt:["O menu de dificuldade duplicado foi removido do início.","Mais de 90 nacionalidades com suas bandeiras, e a lista é traduzida conforme o idioma escolhido."],en:["Removed the duplicate difficulty menu from the start screen.","Over 90 nationalities with their flags, and the list is translated to the chosen language."]},
{v:"1.4",d:"17/11/2026",es:["El modo Realista es todavía más difícil: rivales más fuertes, menos rendimiento propio, menos ofertas de equipos y minijuegos más veloces."],pt:["O modo Realista ficou ainda mais difícil: rivais mais fortes, menos rendimento próprio, menos ofertas de equipes e minijogos mais rápidos."],en:["Realistic mode is even tougher: stronger rivals, lower own performance, fewer team offers and faster minigames."]},
{v:"1.3",d:"17/11/2026",es:["Dificultades reajustadas: Fácil es más accesible y Realista ahora es mucho más exigente (rivales más fuertes, menos chances de que un equipo te fiche y minijuegos más rápidos)."],pt:["Dificuldades reajustadas: Fácil é mais acessível e Realista agora é bem mais exigente (rivais mais fortes, menos chances de uma equipe te contratar e minijogos mais rápidos)."],en:["Difficulties rebalanced: Easy is more forgiving and Realistic is now much tougher (stronger rivals, lower chance of a team signing you and faster minigames)."]},

(function () {

  }
  const later = () => { clearTimeout(tm); tm = setTimeout(pushAll, 2500); };

  document.head.appendChild(css);
